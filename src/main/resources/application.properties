spring.application.name=Catts-backend
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Driver do SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# URL de conexão direta com o Azure SQL
spring.datasource.url=jdbc:sqlserver://catts.database.windows.net;databaseName=CattsDataBase;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=60;
# Credenciais diretas
spring.datasource.username=CloudSA5a870464
spring.datasource.password=Catts@DB


# Blob: nome do container
azure.storage.container-name=imagens

# Upload de fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# Configurações de Autenticação (Google + JWT)
# ==========================================

# Client ID gerado no Google Cloud Console
google.client.id=${GOOGLE_CLIENT_ID}

# Chave secreta para assinar o JWT da sua API
api.security.token.secret=${JWT_SECRET}

spring.config.import=optional:file:.env[.properties]

# Foundry (FLUX.2-flex): valores vem de VARIAVEIS DE AMBIENTE. Vazio = recurso desligado, o app sobe normal.
foundry.endpoint=${FOUNDRY_ENDPOINT:}
foundry.api-key=${FOUNDRY_API_KEY:}
